name: Generate Snake Animation

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:  # Allows manual trigger
  push:
    branches:
      - main

permissions:
  contents: write  # Required to push to output branch

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Create dist directory
        run: mkdir -p dist
      
      - name: Generate snake animation
        uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: abhijha910
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.gif
        continue-on-error: true  # Continue even if snake generation fails
      
      - name: List generated files
        run: |
          echo "Checking generated files..."
          ls -la dist/ || echo "dist directory not found"
          if [ -f dist/github-contribution-grid-snake.svg ]; then
            echo "SVG file exists"
            wc -l dist/github-contribution-grid-snake.svg
            cat dist/github-contribution-grid-snake.svg | head -5
          else
            echo "SVG file NOT found - creating placeholder"
            echo '<svg xmlns="http://www.w3.org/2000/svg"><text>No contributions yet</text></svg>' > dist/github-contribution-grid-snake.svg
          fi
      
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
